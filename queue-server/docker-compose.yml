version: "3.9"

services:
  app:
    image: queue-server
    container_name: queue-server-app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=pubsub;encrypt=false
      - DB_USER=sa
      - DB_PASSWORD=EventFlow123!
      - WEBHOOK_SECRET=27645cb1ad9d43de8b63a7498f4808a0
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      wso2am:
        condition: service_healthy

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: queue-server-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./src/main/resources/init-pubsub.sql:/init.sql
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "EventFlow123!", "-i", "/init.sql", "-C"]

  kafka:
    image: apache/kafka:3.9.0
    container_name: queue-server-kafka
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster
      CLUSTER_ID: "eventflow-kafka-cluster-001"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: queue-server-sqlserver
    environment:
      SA_PASSWORD: "EventFlow123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "EventFlow123!" -Q "SELECT 1" -b -C
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  
  wso2am:
    image: wso2/wso2am:4.6.0
    container_name: queue-server-wso2am
    ports:
      - "9443:9443"    # Publisher + DevPortal (HTTPS)
      - "8280:8280"    # Gateway HTTP (sandbox)
      - "8243:8243"    # Gateway HTTPS (produccion)
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    volumes:
      - wso2am-data:/home/wso2carbon/wso2am-4.6.0/repository
    healthcheck:
      test: curl -k -s https://localhost:9443/services/Version || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  sqlserver-data:
  wso2am-data:
