version: "3.9"

services:
  api:
    image: eventflow
    ports:
      - "8090:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=user
      - RABBITMQ_PASSWORD=password
      - SQLSERVER_URL=jdbc:sqlserver://sqlserver:1433;databaseName=eventflow;encrypt=false
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=EventFlow123!
      - CDC_STRATEGY=native
      - BROKER=rabbitmq
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - api

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../eventflow/src/main/resources/sql/init.sql:/init.sql
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "EventFlow123!", "-i", "/init.sql", "-C"]

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "EventFlow123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver2-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "EventFlow123!" -Q "SELECT 1" -b -C
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=EventFlow123!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch2-data:/usr/share/opensearch/data
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  rabbitmq2-data:
  sqlserver2-data:
  opensearch2-data:
